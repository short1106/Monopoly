# LARP EXTREME: lädt Hochschulen, Städte, Schulen und Straßennamen einmal herunter und committet sie nach assets/larp/.
# Jeder Teil läuft einzeln (fällt einer aus, bleiben die anderen). Start per Hand: Actions → Run workflow.
name: LARP-Daten laden
on:
  workflow_dispatch:
  push:
    paths:
      - tools/larp-data.mjs
      - .github/workflows/larp-data.yml
permissions:
  contents: write
concurrency:
  group: larp-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Städte (Wikidata)
        continue-on-error: true
        timeout-minutes: 10
        run: node tools/larp-data.mjs cities
      - name: Hochschulen (Wikidata)
        continue-on-error: true
        timeout-minutes: 15
        run: node tools/larp-data.mjs unis
      - name: Hochschulen weltweit (Wikidata)
        continue-on-error: true
        timeout-minutes: 10
        run: node tools/larp-data.mjs world
      - name: Schulen (NRW-Schulministerium, OpenStreetMap)
        continue-on-error: true
        timeout-minutes: 15
        run: node tools/larp-data.mjs schools
      - name: Straßen (OpenStreetMap)
        continue-on-error: true
        timeout-minutes: 45
        run: node tools/larp-data.mjs streets
      - name: Daten committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/larp || true
          if git diff --cached --quiet; then echo "Nichts Neues."; exit 0; fi
          git commit -m "LARP: Daten aktualisiert"
          git pull --rebase
          git push
